name: P05b Evidence Campaign

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p05b-evidence.yml'
      - 'training/configs/p05b.yaml'
      - 'training/run_bounded.py'
      - 'training/evaluate_stress.py'
      - 'training/vector_nca/**'
      - 'training/requirements.txt'

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install pinned training environment
        run: python -m pip install -r training/requirements.txt

      - name: Record environment receipt
        run: |
          mkdir -p training/artifacts/p05b-ci
          python --version > training/artifacts/p05b-ci/environment.txt
          python -m pip freeze >> training/artifacts/p05b-ci/environment.txt
          printf 'git_sha=%s\n' "$GITHUB_SHA" >> training/artifacts/p05b-ci/environment.txt
          printf 'runner_os=%s\n' "$RUNNER_OS" >> training/artifacts/p05b-ci/environment.txt
          cp training/configs/p05b.yaml training/artifacts/p05b-ci/config.yaml

      - name: Run deterministic training tests
        working-directory: training
        run: PYTHONPATH=. pytest -q

      - name: Run full three-phenotype campaign
        run: |
          PYTHONPATH=training python training/run_bounded.py \
            --config training/configs/p05b.yaml \
            --phenotype all \
            --out training/artifacts/p05b-ci/campaign

      - name: Evaluate longer horizons and changed lesions
        run: |
          PYTHONPATH=training python training/evaluate_stress.py \
            --config training/configs/p05b.yaml \
            --checkpoints training/artifacts/p05b-ci/campaign \
            --out training/artifacts/p05b-ci/stress-evaluation.json

      - name: Summarize evidence files
        if: always()
        run: |
          find training/artifacts/p05b-ci -type f -maxdepth 4 -print | sort \
            > training/artifacts/p05b-ci/artifact-index.txt
          cat training/artifacts/p05b-ci/artifact-index.txt

      - name: Upload campaign receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05b-evidence-${{ github.sha }}
          path: training/artifacts/p05b-ci
          if-no-files-found: error
          retention-days: 30
